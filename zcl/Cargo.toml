[package]
name = "apis-saltans-zcl"
description = "Zigbee Cluster Library"
authors = ["Richard Neumann <neumann@paulmann.de>"]
license = "MIT"
repository = "https://github.com/PaulmannLighting/apis-saltans"
keywords = ["zigbee", "ZCL", "library"]
categories = ["network-programming"]
documentation = "https://docs.rs/apis-saltans-zcl"
version = "0.15.0"
edition = "2024"
exclude = [".gitignore", "TODO.md"]

[dependencies]
bitflags.workspace = true
bytes = { workspace = true, optional = true }
chrono = { workspace = true, features = ["core-error"] }
const_env.workspace = true
either = { version = "1", default-features = false }
heapless.workspace = true
le-stream = { workspace = true, features = ["derive", "heapless", "intx"] }
libm = { version = "0.2.16", default-features = false }
num_enum.workspace = true
repr-discriminant.workspace = true
serde = { workspace = true, optional = true }
strum.workspace = true
thiserror.workspace = true
zb-aps.workspace = true
zb-core.workspace = true

[features]
default = []
alloc = ["dep:bytes", "le-stream/alloc", "le-stream/bytes", "zb-aps/alloc", "chrono/alloc", "serde?/alloc"]
serde = ["dep:serde", "serde/derive", "bytes?/serde", "chrono/serde", "heapless/serde", "zb-core/serde"]

[lints]
workspace = true
